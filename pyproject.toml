# Runtime dependency set for the deployed serverless function.
# The web tier only reads the pre-built SQLite database, so it needs no pandas;
# pandas and pytest live in requirements-dev.txt for the ETL and the test suite.
[project]
name = "world-cup-analytics"
version = "1.0.0"
description = "Analytics platform over 49,547 international football matches"
dependencies = ["flask==3.1.3"]
requires-python = "~=3.12.0"
